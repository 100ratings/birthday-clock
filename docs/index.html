<body><main class="booting">
<header><h1>Birthday Clock</h1><div class="header-actions"><button id="date-mode" type="button" aria-pressed="false" aria-label="Modo dia e mês. Toque para inverter">DD/MM</button><button id="settings" type="button">Ajustes</button></div></header>
<p id="notice" role="status" aria-live="polite">Pronto para continuar</p>
<section id="today" aria-label="Aniversariante de hoje"></section>
<section id="alarm" aria-label="Estado do aviso"></section>
<h2>Próximas oportunidades</h2>
<section id="upcoming" aria-label="Próximas oportunidades"></section>
<dialog id="config"><form method="dialog">
<button id="update-app" type="button">Atualizar app</button>
<p id="update-status" role="status"></p>
<h2>Avisos pelo Pushover</h2>
<p id="connection-status" role="status"></p>
<div id="pair-fields">
<label>Código de conexão<input id="pair-code" type="text" autocapitalize="none" spellcheck="false" autocomplete="off" placeholder="Cole o código aqui"></label>
<button id="pair-button" type="button">Conectar iPhone</button>
</div>
<label>Minutos de antecedência<input id="lead-minutes" type="number" inputmode="numeric" min="1" max="60" step="1" value="3" required></label>
<label class="check"><input id="at-time" type="checkbox"> Avisar também no horário da mágica</label>
<h2>Inject API</h2>
<label>Seu ID oculto<input id="inject-id" type="text" inputmode="numeric" pattern="[0-9]{1,12}" maxlength="12" placeholder="1234" autocomplete="off"></label>
<button value="save">Salvar</button><button value="cancel" formnovalidate>Cancelar</button>
</form></dialog>
</main>

<script>
(() => {
  try {
    const birthdays = JSON.parse(document.getElementById('birthday-seed').textContent);
    window.__birthdaySeed = birthdays;
    const get = id => document.getElementById(id);
    const minute = 60000;
    const now = Date.now();
    const clock = new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const months = 'janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro'.split(' ');
    const settings = JSON.parse(localStorage.getItem('birthday-clock-config') || '{}');
    let lastInjectName = null;
    try {
      const saved = JSON.parse(localStorage.getItem('birthday-clock-last-inject') || 'null');
      if (saved && saved.id === settings.injectId && typeof saved.name === 'string') lastInjectName = saved.name;
    } catch {}
    let alarm = null;
    try {
      const saved = JSON.parse(localStorage.getItem('birthday-clock-alarm') || 'null');
      if (settings.password && saved && saved.notifyAt > now) alarm = saved;
    } catch {}
    const el = (tag,value='',css='') => {
      const node = document.createElement(tag);
      node.textContent = value;
      if (css) node.className = css;
      return node;
    };
    const btn = (label,primary=false) => el('button',label,primary ? 'primary' : '');
    const start = Math.ceil((now + 2 * minute) / minute) * minute;
    const items = [];
    for (let i=0;i<=1440 && items.length<6;i++) {
      const at = start + i*minute, d = new Date(at);
      const day = d.getHours(), month = d.getMinutes();
      const code = String(day).padStart(2,'0') + String(month).padStart(2,'0');
      if (birthdays[code]) items.push({at,code,name:birthdays[code],label:clock.format(d),birthday:day+' de '+months[month-1]});
    }
    if (!items.length) return;
    const card = item => {
      const node = el('article','','opportunity');
      const timing = el('div','','opportunity-time');
      timing.append(el('time',item.label),el('small','Em '+Math.ceil((item.at-now)/minute)+' min','countdown'));
      const person = el('div','','opportunity-person');
      const identity = el('div','','name-with-inject');
      identity.append(el('strong',item.name));
      if (item.name === lastInjectName) identity.append(el('span','✓ No Inject','inject-indicator'));
      person.append(identity,el('small',item.birthday,'opportunity-date'));
      const control = el('div','','opportunity-control');
      const isMarked = alarm && alarm.at === item.at && alarm.code === item.code;
      const action = btn(isMarked ? '✓' : (item.at-now) <= (settings.leadMinutes ?? 3)*minute ? 'Avisar agora' : alarm ? 'Trocar aviso' : 'Me avise',true);
      if (isMarked) action.classList.add('selected-action');
      action.disabled = Boolean(isMarked);
      action.setAttribute('aria-label',isMarked ? 'Aviso marcado para ' + item.label + ', ' + item.name : action.textContent + ' para ' + item.label + ', ' + item.name);
      control.append(action);
      node.append(timing,person,control);
      return node;
    };
    get('upcoming').replaceChildren(...items.map(card));
    const today = new Date(now);
    const todayCode = String(today.getDate()).padStart(2,'0')+String(today.getMonth()+1).padStart(2,'0');
    const todaySection = get('today');
    todaySection.replaceChildren();
    if (birthdays[todayCode]) {
      const area=el('div','','today-birthday');
      const row=el('div','','today-birthday-row');
      const identity=el('div','','today-identity');
      identity.append(el('strong',birthdays[todayCode],'today-birthday-name'));
      if (birthdays[todayCode] === lastInjectName) identity.append(el('span','✓ No Inject','inject-indicator'));
      row.append(identity,btn('Enviar ao Inject'));
      row.lastElementChild.classList.add('today-inject-button');
      area.append(el('small','Aniversariante de hoje · '+today.getDate()+' de '+months[today.getMonth()],'today-birthday-label'),row);
      todaySection.append(area);
    }
    const box = get('alarm');
    const info = el('div','','alarm-info');
    if (alarm) {
      box.classList.add('has-alarm');
      info.append(el('small','✓ Aviso marcado · '+alarm.label,'marked-label'),el('strong',alarm.name,'alarm-name'));
      const times = alarm.atTime && alarm.notifyAt < alarm.at ? clock.format(alarm.notifyAt)+' e '+clock.format(alarm.at) : clock.format(alarm.notifyAt);
      info.append(el('small','Notificações às '+times,'alarm-times'));
      const controls=el('div','','alarm-controls');
      controls.append(btn('Cancelar'));
      if (settings.injectId) controls.append(btn('Reenviar'));
      box.replaceChildren(info,controls);
    } else {
      info.append(el('strong','Nenhum aviso marcado','alarm-empty-title'),el('small','Escolha uma oportunidade abaixo','alarm-times'));
      box.replaceChildren(info);
    }
    document.querySelector('main').classList.remove('booting');
  } catch (error) {
    console.warn('Pré-carregamento indisponível, inicializando normalmente',error);
  }
})();
</script></body></html>
